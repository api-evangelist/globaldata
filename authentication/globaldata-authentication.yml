server_metadata:
  rfc_8414:
    url: https://mcp.globaldata.com/.well-known/oauth-authorization-server
    status: 200
    issuer: https://mcp.globaldata.com
    authorization_endpoint: https://mcp.globaldata.com/authorize
    token_endpoint: https://mcp.globaldata.com/token
    jwks_uri: https://mcp.globaldata.com/.well-known/jwks.json
    response_types_supported: [code]
    grant_types_supported: [authorization_code, refresh_token, client_credentials]
    code_challenge_methods_supported: [S256]
    token_endpoint_auth_methods_supported: [none, client_secret_post, private_key_jwt]
    token_endpoint_auth_signing_alg_values_supported: [RS256, PS256, ES256]
    scopes_supported: [openid, profile, email, offline_access]
    file: ../well-known/globaldata-mcp-oauth-authorization-server.json
  rfc_9728:
    url: https://mcp.globaldata.com/.well-known/oauth-protected-resource
    status: 200
    resource: https://mcp.globaldata.com
    authorization_servers: [https://mcp.globaldata.com]
    file: ../well-known/globaldata-mcp-oauth-protected-resource.json
  discrepancy_note: >-
    The gateway's RFC 8414 document names ITSELF as issuer with /authorize and /token on
    mcp.globaldata.com, while the prose documentation tells callers to use login.globaldata.com.
    Both are real: the gateway proxies or fronts GlobalData SSO. login.globaldata.com publishes no
    RFC 8414 document of its own (its /.well-known/oauth-authorization-server 302s to an error
    page), so the mcp.globaldata.com copy is the only machine-readable server metadata GlobalData
    publishes. A client following the RFC 9728 challenge lands on the working one.
authorization_model:
  mechanism: subscription entitlement, evaluated server-side per credential
  note: >-
    Scopes are OIDC identity scopes only. Access to data is decided by what the caller's GlobalData
    subscription includes: a vertical the subscription does not cover cannot be connected to, and a
    domain it does not include will not reveal — discover_capabilities / reveal_advanced return a
    not_entitled response rather than pretending to reveal it. Several domains carry their own
    entitlement (contacts, market_data, fdi_projects, ict_contracts).
  source: https://mcp.globaldata.com/ (Sections 03, 12)
no_api_keys: >-
  GlobalData publishes no API-key scheme for this surface. There is no key prefix, no key
  management page, and no anonymous tier.
