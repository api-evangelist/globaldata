verticals_note: The developer documentation lists 20 site slugs (consumer, retail, packaging, ads, financialservices,
  technology, disruptor, mining, oilgas, power, construction, insurance, automotive, tourism, foodservice,
  apparel, meedprojects, sport, explorer, agri). The AIR manifest at /.well-known/ai-catalog.json advertises
  23 endpoints — the 20 above plus celentintelligence, strategicintelligence and stylus. The manifest
  is the machine-readable source of truth and is what an agent would read.
related_surfaces:
  healthcare_pharma_mcp: The documentation references a separate "Healthcare Pharma MCP" for drug-level
    patent expiry data, and GlobalData announced Healthcare MCP availability on 30 July 2026. No endpoint
    for it is published in the AIR manifest or the developer reference, and no pharma/healthcare MCP host
    resolved on probe. Recorded as named-but-undiscoverable.
  ava_mcp: GlobalData announced Ava MCP (its AI research analyst, exposed via REST API or MCP) on 21 July
    2026. No Ava endpoint is published. api.globaldata.com resolves to an AWS ELB that returned 503 on
    every path at probe time.
