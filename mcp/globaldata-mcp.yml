method: searched
source: https://mcp.globaldata.com/
revised: '2026-09-13'
name: GlobalData Intelligence Center MCP
summary: >-
  GlobalData Plc operates a first-party, production Model Context Protocol gateway at
  mcp.globaldata.com that exposes its business-intelligence estate as callable agent tools.
  The gateway is documented publicly at the host root ("GlobalData Intelligence Center — MCP
  Developer Documentation"), advertises itself in a machine-readable Agentic Resource Discovery
  manifest at /.well-known/ai-catalog.json, and publishes RFC 8414 / RFC 9728 OAuth metadata.
  It is one MCP server endpoint per industry vertical, all sharing one tool interface.
ownership: >-
  First-party and unambiguous. mcp.globaldata.com is a GlobalData-controlled host; the
  documentation page carries the GlobalData Plc registered-office footer (John Carpenter House,
  John Carpenter Street, London EC4Y 0AN, registered in England No. 03925319), the AIR manifest
  identifies the host as did:web:mcp.globaldata.com, authentication is delegated to GlobalData's
  own SSO at login.globaldata.com, and support routes to DDStechSupport@globaldata.com.

deployment:
  mode: remote
  endpoint: https://mcp.globaldata.com/{site}/mcp
  auth: oauth
  verified: probed
  note: >-
    Remote-only. There is no first-party stdio package: the Claude Desktop instructions in
    GlobalData's own documentation use the generic third-party `npx -y mcp-remote <url>` bridge
    pointed at the hosted endpoint, which is a client-side shim for a remote server, not a
    GlobalData-published local server. Nothing named globaldata ships on npm or PyPI (both
    names are squatted by unrelated third-party packages — see packages/).
  probe:
    url: https://mcp.globaldata.com/mcp
    method: POST
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    http_status: 401
    response: '{"error":"Unauthorized: token required"}'
    www_authenticate: >-
      Bearer realm="GlobalData MCP",
      resource_metadata="https://mcp.globaldata.com/.well-known/oauth-protected-resource/mcp"
    checked: '2026-09-13'
    note: >-
      Every vertical endpoint probed (ads, disruptor, technology, mining, sport) returned the same
      401. The live tool list with real inputSchema requires an authenticated session, so the tool
      inventory below is transcribed from GlobalData's own published developer reference and the
      AIR manifest — names, descriptions and availability are first-party, input schemas are NOT
      captured and require authenticated introspection.
  health:
    url: https://mcp.globaldata.com/health
    http_status: 200
    body: Healthy

transport:
  protocol: Streamable HTTP
  rpc: JSON-RPC 2.0
  streaming: SSE on the same endpoint
  accept_header: 'application/json, text/event-stream'
  source: https://mcp.globaldata.com/ (Section 12, FAQ)

discovery:
  air_manifest:
    url: https://mcp.globaldata.com/.well-known/ai-catalog.json
    spec_version: '1.0'
    http_status: 200
    host_identifier: did:web:mcp.globaldata.com
    entries: 23
    file: ../well-known/globaldata-ai-catalog.json
    note: >-
      Agentic Resource Discovery manifest. Each entry is type application/mcp-server+json and
      carries the endpoint URL, a description, the six always-on capabilities, and
      representativeQueries. This is the machine-readable index of every vertical server.
  documentation: https://mcp.globaldata.com/
  oauth_authorization_server: https://mcp.globaldata.com/.well-known/oauth-authorization-server
  oauth_protected_resource: https://mcp.globaldata.com/.well-known/oauth-protected-resource

authentication:
  model: OAuth 2.1 via GlobalData SSO
  flows:
    - id: authorization_code_pkce
      label: OAuth 2.1 Authorization Code + PKCE
      audience: interactive clients (claude.ai connectors, Copilot Studio, browsers)
      authorization_server: https://login.globaldata.com
      token_endpoint: https://login.globaldata.com/oauth/token
      code_challenge_methods: [S256]
      note: Redirect URI must be registered with the GlobalData DDS team before use.
    - id: password
      label: Credentials (resource owner password)
      audience: server-to-server agents and scripts
      token_endpoint: https://login.globaldata.com/oauth/token
      grant_type: password
      scopes: [openid, profile, email, offline_access]
      note: Exchanges a GlobalData username and password for a bearer token, expires_in 3600.
    - id: client_credentials
      label: Client credentials
      audience: declared in the gateway's own RFC 8414 metadata
      source: https://mcp.globaldata.com/.well-known/oauth-authorization-server
  sso_options:
    - GlobalData username/password
    - Microsoft Entra ID
    - Google Workspace
    - Okta / enterprise SSO
  entitlements: >-
    Tool visibility is driven by subscription entitlement, not only by the reveal step. A domain
    the subscription does not include will not reveal and the response says so (not_entitled).
  source: https://mcp.globaldata.com/ (Section 04)

architecture:
  tiers:
    - tier: 1
      name: MCPGateway
      role: SSO auth, routing, session state, tool registry
    - tier: 2
      name: CommonContent MCP Server
      role: tool execution, entity resolver, ElasticSearch query builder (BM25 + KNN)
    - tier: 3
      name: Data layer
      role: 6 ElasticSearch clusters, SQL databases, market data APIs
  join_key:
    field: company_id
    note: >-
      Company ID (returned by list_companies, and by resolve_entities as company_id) is the
      primary join key across every content domain. A second identifier, cdms_company_id, is
      returned alongside it and is used only by a handful of tools that ask for it by name.
  source: https://mcp.globaldata.com/ (Section 02)

progressive_discovery:
  model: >-
    The gateway does not expose all tools at connect time. Seven gateway tools are always visible;
    a domain's standard tools appear only after discover_capabilities('<domain>'), and its
    analytics tools after reveal_advanced('<domain>'). Both emit notifications/tools/list_changed.
  levels:
    - level: 0
      label: Always on
      unlock: none
    - level: 1
      label: Standard
      unlock: discover_capabilities('<domain>')
    - level: 2
      label: Advanced / analytics
      unlock: reveal_advanced('<domain>')
  caveat: >-
    GlobalData's own documentation warns that a freshly revealed tool may not be callable by name
    until the client re-fetches tools/list, and recommends search(domain, keywords) immediately
    after a reveal.
  source: https://mcp.globaldata.com/ (Section 03)

response_envelope:
  fields:
    - {field: result, meaning: the data payload}
    - {field: delegated_tool, meaning: which tool the search facade actually ran}
    - {field: route, meaning: why that tool was chosen}
    - {field: applied_filters, meaning: true scope after canonicalisation — verify before quoting counts}
    - {field: resolved, meaning: each input term, its canonical value, and a 0-1 confidence score}
    - {field: dropped_filters, meaning: filters that could not be honored}
    - {field: warnings, meaning: anything silently lost}
    - {field: scope_warning, meaning: raised when a primary filter could not apply and scope degraded}
    - {field: pagination, meaning: 'page, page_size, returned, total_records, total_pages, has_more, next_page.example_args'}
    - {field: routing_hint, meaning: sibling tools to try when routing was ambiguous}
    - {field: no_results_hint, meaning: sibling tools to try when results are empty}
    - {field: unknown_fields, meaning: fields passed to fields= that did not match}
  preflight_rejection: >-
    A query with no selective filter is rejected before execution with a result_set_too_large
    error that lists the filters which would make it valid.
  source: https://mcp.globaldata.com/ (Section 08)

entity_resolution:
  tool: resolve_entities
  pipeline: BM25 + KNN hybrid search against a GlobalData taxonomy ElasticSearch index
  confidence_threshold: 0.65
  below_threshold: filter is dropped and reported in dropped_filters
  fixed_choice_fields: >-
    dealType, sentiment, newsCategory take an exact/alias match first and, since July 2026, an
    AI-assisted fuzzy match as a second attempt before a value is dropped.
  resolvable_dimensions:
    common: [industry, location, theme, hqCountry]
    deals: [dealType, dealStatus, dealRationale, acquirerCountry]
    news: [newsCategory, sentiment]
    mining: [commodity, mineMethod, mineStage]
  free_text_passthrough: [companyName, keyword, job title]
  source: https://mcp.globaldata.com/ (Sections 03, 08)

versioning:
  promise: >-
    Tool changes are additive and backward-compatible. Breaking changes ship as new tool names;
    old names are deprecated with advance notice and a migration window before removal.
  notification: notifications/tools/list_changed
  fresh_sessions: every initialize / tools/list returns the latest tool definitions
  source: https://mcp.globaldata.com/ (Section 11)

tools:
  status: published
  method: searched
  schema_capture: >-
    NOT captured. inputSchema for each tool requires an authenticated tools/list call; the
    anonymous probe returns 401. Names, descriptions and availability below are transcribed
    verbatim-in-substance from GlobalData's own published developer reference.
  gateway:
    - name: list_domains
      level: 0
      description: >-
        Lists all available domains for your vertical with their unlock status and the exact
        command to reveal each one.
    - name: discover_capabilities
      level: 0
      description: Reveals a domain's standard tools for this session; emits notifications/tools/list_changed.
    - name: reveal_advanced
      level: 0
      description: Reveals a domain's analytics tools alongside its standard set.
    - name: get_capabilities
      level: 0
      description: Returns the full domain and tool catalog without revealing or enabling anything.
    - name: tool_search
      level: 0
      description: Searches all tools by keyword across all domains, including unrevealed ones.
    - name: search
      level: 0
      description: >-
        Universal entry point. Accepts a natural-language query plus optional filters, resolves
        entities internally, routes to the right tool by intent, and returns data plus
        delegated_tool, route and applied_filters. Dispatches to any tool, revealed or not.
      note: 'Parameter renamed from query to keywords; query still works as a legacy alias.'
    - name: resolve_entities
      level: 0
      description: >-
        Maps free-text terms to canonical GlobalData taxonomy values with a 0-1 confidence score.

