aid: globaldata
name: GlobalData
description: >-
  GlobalData Plc is a London-listed data, analytics and insights company (LSE: DATA) whose
  Intelligence Center platform covers companies, deals, news, filings, patents, job postings,
  research reports, projects and market data across 20+ industry verticals. Its machine-readable
  surface is agent-native rather than REST-first: GlobalData operates a first-party Model Context
  Protocol gateway at mcp.globaldata.com that exposes the estate as callable agent tools, one MCP
  server endpoint per vertical, behind OAuth 2.1 via GlobalData SSO. The gateway publishes a full
  developer reference at its host root, RFC 8414 and RFC 9728 OAuth metadata, and an Agentic
  Resource Discovery (AIR) manifest at /.well-known/ai-catalog.json advertising all 23 vertical
  endpoints. No OpenAPI, GraphQL SDL, AsyncAPI or SOAP contract is published anywhere.
