apis:
- name: GlobalData Intelligence Center MCP
  description: >-
    A governed Model Context Protocol gateway that turns GlobalData's business intelligence into
    tools an AI agent can call directly. One MCP server endpoint per industry vertical, all sharing
    a single tool interface over Streamable HTTP with JSON-RPC 2.0. Seven gateway tools are always
    on (list_domains, search, resolve_entities, discover_capabilities, reveal_advanced,
    get_capabilities, tool_search); domain tools for companies, deals, news, filings, patents, jobs,
    reports, projects, contacts, market data and vertical-specific databases are revealed
    progressively and filtered by subscription entitlement. Authentication is OAuth 2.1 via
    GlobalData SSO at login.globaldata.com. The anonymous tools/list probe returns HTTP 401, so the
    live input schemas require an authenticated session.
  image: https://www.globaldata.com/wp-content/uploads/2025/12/cropped-cropped-gd_icon-192x192.png
  humanURL: https://mcp.globaldata.com/
  baseURL: https://mcp.globaldata.com/{site}/mcp
